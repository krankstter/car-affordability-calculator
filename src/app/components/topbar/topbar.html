<header class="topbar glass">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 16.5 5.4 11a2 2 0 0 1 1.9-1.4h9.4A2 2 0 0 1 18.6 11l1.4 5.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="16" width="18" height="4.2" rx="1.6" stroke="#fff" stroke-width="1.8"/>
        <circle cx="7.3" cy="20.4" r="1.1" fill="#fff"/>
        <circle cx="16.7" cy="20.4" r="1.1" fill="#fff"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>Car Affordability Calculator</h1>
      <p>Loan · fuel · insurance · maintenance · all in one place</p>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="reset-btn" type="button" aria-label="Reset all values to defaults" (click)="onReset()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span>
    </button>
    <button
      class="theme-switch"
      type="button"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="themeService.theme() === 'dark'"
      (click)="themeService.toggle()"
    >
      <span class="thumb">
        @if (themeService.theme() !== 'dark') {
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        } @else {
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        }
      </span>
    </button>
  </div>
</header>
