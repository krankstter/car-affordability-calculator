@if (visible()) {
  <div class="install-banner glass" role="status">
    @if (isIos()) {
      <span class="install-text">Add this app to your home screen: tap Share, then "Add to Home Screen".</span>
    } @else {
      <span class="install-text">Install this app for quicker access next time.</span>
      <button type="button" class="suggest-btn" (click)="onInstallClick()">Install</button>
    }
    <button type="button" class="install-dismiss" aria-label="Dismiss" (click)="onDismiss()">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
}
