name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This repo deploys to a project subpath (https://krankstter.github.io/car-affordability-calculator/),
      # not the root domain, so the base href must be overridden here only — the default
      # `npm run build` (base href "/") is still what Capacitor/local dev use.
      - run: npx ng build --base-href /car-affordability-calculator/
      - run: node scripts/inject-csp-hashes.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/car-affordability-calculator/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
